<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sound preview</title></head>
<body>
<p>Renders every sound effect (one per second or so) and the music to WAV.</p>
<script type="module">
import { useOfflineContext, playAtTime, EFFECT_NAMES } from '../src/audio/sfx.js';
import { renderMusic } from '../src/audio/music.js';

const RATE = 44100;

// Interleave the two channels into a 16-bit stereo WAV.
function wav(buffer) {
  const L = buffer.getChannelData(0), R = buffer.getChannelData(1);
  const data = new Float32Array(L.length * 2);
  for (let i = 0; i < L.length; i++) { data[i * 2] = L[i]; data[i * 2 + 1] = R[i]; }
  const out = new DataView(new ArrayBuffer(44 + data.length * 2));
  const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); out.setUint32(4, 36 + data.length * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, RATE, true); out.setUint32(28, RATE * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true);
  str(36, 'data'); out.setUint32(40, data.length * 2, true);
  let peak = 0, sum = 0;
  for (let i = 0; i < data.length; i++) {
    const v = Math.max(-1, Math.min(1, data[i]));
    peak = Math.max(peak, Math.abs(v)); sum += v * v;
    out.setInt16(44 + i * 2, v * 0x7fff, true);
  }
  return { bytes: new Uint8Array(out.buffer), peak, rms: Math.sqrt(sum / data.length) };
}

// Per-effect loudness check, then the sampler.
async function renderEffects() {
  const report = {};
  for (const name of EFFECT_NAMES) {
    const off = new OfflineAudioContext(2, RATE * 2, RATE);
    useOfflineContext(off);
    playAtTime(name, 0.02, { chain: 6, size: 5, tier: 4, i: 2, hard: 0.8, kind: 'bomb' });
    const buf = await off.startRendering();
    let peak = 0;
    for (let ch = 0; ch < 2; ch++) for (const v of buf.getChannelData(ch)) peak = Math.max(peak, Math.abs(v));
    report[name] = +peak.toFixed(3);
  }
  const plan = [];
  let t = 0.3;
  const variants = {
    match: [{ size: 3 }, { size: 4 }, { size: 5 }],
    sparkle: [{ kind: 'stripe' }, { kind: 'wrapped' }, { kind: 'bomb' }],
    zap: [{ dir: 'row' }, { dir: 'col' }],
    cheer: [{ tier: 1 }, { tier: 2 }, { tier: 3 }, { tier: 4 }],
    star: [{ i: 0 }, { i: 1 }, { i: 2 }],
  };
  for (const name of EFFECT_NAMES) {
    for (const opts of variants[name] ?? [{}]) {
      plan.push([name, t, opts]);
      t += name === 'win' || name === 'fanfare' || name === 'lose' ? 2.2 : name === 'cheer' ? 1.4 : 0.9;
    }
  }
  // A cascade: matches climbing the scale, pops panned across the board.
  for (let c = 1; c <= 8; c++) {
    plan.push(['match', t, { chain: c, x: (c % 3) - 1 }]);
    for (let k = 0; k < 3; k++) plan.push(['pop', t + k * 0.035, { x: (c % 3) - 1 }]);
    t += 0.42;
  }
  const off = new OfflineAudioContext(2, Math.ceil(RATE * (t + 1)), RATE);
  useOfflineContext(off);
  for (const [name, at, opts] of plan) playAtTime(name, at, opts);
  return { report, order: plan.map((p) => `${p[1].toFixed(1)}s ${p[0]}${Object.keys(p[2]).length ? ' ' + JSON.stringify(p[2]) : ''}`), file: wav(await off.startRendering()) };
}

async function renderSong() {
  const off = new OfflineAudioContext(2, RATE * 40, RATE);
  const bus = useOfflineContext(off);
  renderMusic(off, bus, 39.5);
  return wav(await off.startRendering());
}

window.renderAll = async () => {
  const fx = await renderEffects();
  const map = await renderSong();
  const level = map;
  const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
  return {
    report: fx.report, order: fx.order,
    files: {
      effects: { data: b64(fx.file.bytes), peak: fx.file.peak, rms: fx.file.rms },
      map: { data: b64(map.bytes), peak: map.peak, rms: map.rms },
      level: { data: b64(level.bytes), peak: level.peak, rms: level.rms },
    },
  };
};
</script></body></html>
