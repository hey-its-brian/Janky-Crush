<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Janky Crush">
<meta name="theme-color" content="#0c0a1d">
<title>Janky Crush</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/chakra-petch.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-ring"></div>
  <div class="bg-square"></div>
</div>

<!-- Level map -->
<section id="map-screen" class="map-screen" aria-label="Level map">
  <header class="map-head">
    <h1 class="logo"><span>Janky</span> <span>Crush</span></h1>
    <div class="pill pill-static" aria-label="Stars collected">
      <b class="star-icon" aria-hidden="true"></b>
      <span id="total-stars">0</span>
    </div>
  </header>
  <div id="map-scroll" class="map-scroll">
    <div id="map-path" class="map-path"></div>
  </div>
</section>

<!-- Playing a level -->
<main id="game-screen" class="screen" hidden>
  <header class="topbar">
    <button id="to-map" class="pill" type="button" aria-label="Back to map">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Map
    </button>
    <h1 id="level-name">Level 1</h1>
    <button id="restart" class="pill pill-icon" type="button" aria-label="Restart level">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>
    </button>
  </header>

  <section class="hud">
    <div class="card">
      <span class="label">Goal</span>
      <span class="goal-line">
        <i id="goal-icon" class="goal-icon" aria-hidden="true"></i>
        <span class="value" id="goal-value">0</span>
      </span>
      <span class="sub" id="goal-sub">points</span>
    </div>
    <div class="card card-moves">
      <span class="label">Moves</span>
      <span class="big" id="moves">0</span>
    </div>
    <div class="card">
      <span class="label">Score</span>
      <span class="value" id="score">0</span>
      <div class="bar">
        <div class="bar-fill" id="score-fill"></div>
        <div class="bar-marks" id="score-marks"><i></i><i></i><i></i></div>
      </div>
      <div class="stars" id="score-stars"><b></b><b></b><b></b></div>
    </div>
  </section>

  <div class="spacer"></div>
  <canvas id="board" class="board"></canvas>
  <div class="spacer"></div>
</main>

<div id="banner" class="banner" hidden aria-live="polite"></div>

<div id="dialog" class="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2>
    <div id="dialog-body" class="dialog-body"></div>
    <div id="dialog-actions" class="dialog-actions"></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
