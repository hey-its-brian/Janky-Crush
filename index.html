<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Janky Crush">
<meta name="theme-color" content="#59c6ff">
<title>Janky Crush</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/hotsprings.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Start screen: pick a save file -->
<section id="title-screen" class="title-screen" aria-label="Choose a save" hidden>
  <div class="title-inner">
    <h1 class="logo toon"><span>Janky</span><span>Crush</span></h1>
    <div id="title-host" class="title-host" aria-hidden="true"></div>
    <div id="save-cards" class="save-cards"></div>
  </div>
</section>

<!-- Level map -->
<section id="map-screen" class="map-screen" aria-label="Level map">
  <div id="map-scroll" class="map-scroll">
    <div id="map" class="map-world"></div>
  </div>
  <header class="topbar">
    <button id="home" class="round-btn small-round" type="button" aria-label="Save files">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 10v9.5h11V10" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/></svg>
    </button>
    <button id="lives-pill" class="pill pill-btn" type="button" aria-label="Lives">
      <i class="pill-icon" id="heart-icon" aria-hidden="true"></i>
      <span class="pill-stack"><b id="lives-count">5</b><small id="lives-timer">Full</small></span>
    </button>
    <div class="avatar top-avatar" aria-label="Stars collected">
      <div id="top-avatar-art" aria-hidden="true"></div>
      <span class="star-badge"><i class="star-icon"></i><span id="total-stars">0</span></span>
    </div>
    <button id="coins-pill" class="pill pill-btn" type="button" aria-label="Coins and shop">
      <i class="pill-icon" id="coin-icon" aria-hidden="true"></i>
      <span id="coins-count">0</span>
    </button>
    <button id="settings" class="round-btn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
  </header>
  <button id="play-btn" class="play-btn toon" type="button">Play</button>
</section>

<!-- Playing a level -->
<div id="world" class="world" aria-hidden="true" hidden></div>
<main id="game-screen" class="screen" hidden>
  <div class="hud">
    <div class="moves" aria-label="Moves left">
      <small>MOVES</small>
      <b id="moves" class="toon">0</b>
    </div>
    <div class="panel goal">
      <i id="goal-icon" class="goal-icon" aria-hidden="true"></i>
      <div id="goal-single">
        <div class="label" id="goal-label">Score</div>
        <div class="count" id="goal-value">0</div>
      </div>
      <div id="goal-fruits" class="goal-fruits" hidden></div>
    </div>
    <button id="pause" class="round-btn" type="button" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#fff"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#fff"/></svg>
    </button>
  </div>

  <div class="panel meter-wrap">
    <div class="score-line"><span class="label">SCORE</span><b id="score">0</b></div>
    <div class="meter" role="meter" aria-label="Score toward three stars" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter">
      <div id="meter-fill" class="meter-fill"></div>
      <div class="meter-star"><i></i></div>
      <div class="meter-star"><i></i></div>
      <div class="meter-star"><i></i></div>
    </div>
  </div>

  <div class="spacer"></div>
  <div class="board-wrap">
    <canvas id="board" class="board"></canvas>
    <div id="callout" class="callout toon" aria-live="polite" hidden></div>
  </div>

  <div class="spacer"></div>
  <div class="host-row">
    <div id="host" class="host"></div>
    <div id="host-bubble" class="bubble" hidden></div>
    <div id="boosters" class="boosters" aria-label="Boosters"></div>
  </div>
</main>

<div id="banner" class="banner toon" hidden aria-live="polite"></div>

<div id="dialog" class="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <h2 id="dialog-title" class="ribbon toon"></h2>
    <div id="dialog-body" class="dialog-body"></div>
    <div id="dialog-actions" class="dialog-actions"></div>
    <div id="dialog-host" class="dialog-host" aria-hidden="true"></div>
  </div>
  <div id="confetti" class="confetti-layer" aria-hidden="true"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
